name: Anúncios pagos (Meta Ads, só leitura)
on:
  schedule:
    - cron: "15 1 * * *"   # todo dia 22:15 (Brasília): só leitura, nunca cria/pausa/muda orçamento
  workflow_dispatch:
permissions:
  contents: write   # só para gravar dados/anuncios.json (números de desempenho, sem segredo)
concurrency:
  group: anuncios
  cancel-in-progress: false
jobs:
  anuncios:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Status do token (confere a permissão ads_read)
        run: python3 tools/anuncios.py status
      - name: Coletar desempenho dos anúncios (só leitura)
        run: python3 tools/anuncios.py coletar | tee resumo.txt
      - name: Guardar no repositório (alimenta o painel)
        run: |
          git config user.name "achadinhos-bot"
          git config user.email "achadinhos-bot@users.noreply.github.com"
          git add dados/anuncios.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "Anúncios pagos: retrato do dia"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "::warning::não consegui enviar dados/anuncios.json"; exit 0
      - name: Resumo da execução
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat resumo.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
