name: Instagram (métricas dos posts)
on:
  schedule:
    - cron: "30 1 * * *"   # todo dia 22:30 (Brasília): só leitura, não publica nada
  workflow_dispatch:
permissions:
  contents: write   # só para gravar dados/metricas.json (números de desempenho, sem segredo)
concurrency:
  group: metricas
  cancel-in-progress: false
jobs:
  metricas:
    runs-on: ubuntu-latest
    env:
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Coletar métricas (só leitura no Instagram)
        env:
          MET_SALVAR: "1"
        run: python3 tools/instagram.py metricas | tee resumo.txt
      - name: Robô Analista (o que mais rende, só números)
        run: python3 -I tools/analista.py
      - name: Guardar o retrato do dia no repositório (alimenta o painel)
        run: |
          git config user.name "achadinhos-bot"
          git config user.email "achadinhos-bot@users.noreply.github.com"
          git add dados/metricas.json dados/estrategia.json
          if git diff --cached --quiet; then echo "sem mudança"; exit 0; fi
          git commit -m "Métricas do Instagram: retrato do dia"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          echo "::warning::não consegui enviar dados/metricas.json"; exit 0
      - name: Resumo da execução
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat resumo.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar como artefato (não vai para o repositório público)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metricas-instagram
          path: metricas.json
          retention-days: 90
          if-no-files-found: ignore
