name: Fotos dos produtos
on:
  workflow_dispatch:
  push:
    paths: ['tools/fotos.py', '.github/workflows/fotos.yml']
permissions:
  contents: write
concurrency:
  group: fotos
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: pip install --user pillow
      - name: Baixar fotos melhores
        run: python3 tools/fotos.py
      - name: Regerar a página
        run: python3 -I tools/vigia.py build
      - name: Guardar
        run: |
          git config user.name "achadinhos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add img dados/itens.json index.html
          if git diff --cached --quiet; then echo "nada novo"; exit 0; fi
          git commit -m "Fotos melhores dos produtos (tools/fotos.py)"
          git pull --rebase
          git push
